<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tattoo Raffle — one ticket, one owner</title>
  <desc id="desc">A dark gold ticket grid illustrating selection, reservation and assignment.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#4f3e26"/><stop offset="1" stop-color="#071317"/></radialGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#e0bf69"/><stop offset="1" stop-color="#f5e2a9"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#071317"/>
  <circle cx="925" cy="305" r="370" fill="url(#glow)" opacity=".7"/>
  <g fill="#0d1d20" stroke="#66583d" stroke-width="1.5" font-family="monospace" font-size="35" text-anchor="middle">
    <rect x="700" y="180" width="130" height="130" rx="5"/><rect x="848" y="180" width="130" height="130" rx="5"/><rect x="996" y="180" width="130" height="130" rx="5"/>
    <rect x="700" y="330" width="130" height="130" rx="5"/><rect x="848" y="330" width="130" height="130" rx="5"/><rect x="996" y="330" width="130" height="130" rx="5"/>
    <text x="765" y="257" fill="#a79d86">078</text><text x="913" y="257" fill="#a79d86">079</text><text x="1061" y="257" fill="#a79d86">080</text>
    <text x="765" y="407" fill="#a79d86">081</text><text x="913" y="407" fill="#a79d86">082</text><text x="1061" y="407" fill="#a79d86">083</text>
  </g>
  <rect x="848" y="180" width="130" height="130" rx="5" fill="#e0bf69" stroke="#f5e2a9" stroke-width="3"/>
  <text x="913" y="257" fill="#141b17" font-family="monospace" font-size="35" font-weight="700" text-anchor="middle">079</text>
  <text x="913" y="282" fill="#3f3525" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="middle">RESERVED</text>
  <g fill="#e0bf69" font-family="monospace" font-size="15" letter-spacing="2">
    <text x="70" y="87">LEONARD / SOLUTIONS</text>
    <text x="70" y="168">03 / PAYMENTS &amp; RESERVATIONS</text>
  </g>
  <text x="65" y="283" fill="#f7f4e9" font-family="Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-5">Tattoo Raffle</text>
  <text x="70" y="345" fill="#d0c6ac" font-family="Arial, sans-serif" font-size="29">One ticket. One owner.</text>
  <path d="M70 405H600" stroke="url(#gold)" stroke-opacity=".6"/>
  <g fill="#e0bf69" font-family="monospace" font-size="18" letter-spacing="1">
    <text x="70" y="460">SELECT</text><text x="225" y="460">→</text>
    <text x="275" y="460">RESERVE</text><text x="440" y="460">→</text><text x="490" y="460">ASSIGN</text>
  </g>
  <text x="70" y="560" fill="#a99e88" font-family="monospace" font-size="15" letter-spacing="2">INTERACTIVE CASE STUDY · NO REAL PAYMENT</text>
</svg>
